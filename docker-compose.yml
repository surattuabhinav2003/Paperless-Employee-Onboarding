version: '3.9'

# Local development dependencies for the CloudFuze HR Onboarding Portal.
# Only PostgreSQL (and an optional mail catcher) run here - the backend and
# frontend are started from their own directories during development.
services:
  postgres:
    image: postgres:16-alpine
    container_name: cloudfuze-onboarding-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cloudfuze_onboarding}
      POSTGRES_USER: ${POSTGRES_USER:-cloudfuze}
      # No usable default: the container refuses to start without a real
      # password rather than quietly accepting a guessable one.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      TZ: UTC
    ports:
      # Bound to the loopback interface on purpose. Without the 127.0.0.1
      # prefix Docker publishes on 0.0.0.0, so anyone who can reach this
      # machine can open a psql session against the candidate data.
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - onboarding-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-cloudfuze} -d ${POSTGRES_DB:-cloudfuze_onboarding}']
      interval: 10s
      timeout: 5s
      retries: 10

  # Optional: catches invitation emails when EMAIL_PROVIDER=smtp locally.
  # UI at http://localhost:8025, SMTP on 1025.
  mailpit:
    image: axllent/mailpit:latest
    container_name: cloudfuze-onboarding-mail
    restart: unless-stopped
    profiles: ['mail']
    ports:
      - '127.0.0.1:8025:8025'
      - '127.0.0.1:1025:1025'

volumes:
  onboarding-db-data:
