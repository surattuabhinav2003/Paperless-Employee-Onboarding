# =====================================================================
# CloudFuze HR Onboarding Portal - base configuration
# Every secret is read from the environment. Nothing sensitive is
# committed here. See application-example.properties and .env.example.
# =====================================================================
spring.application.name=cloudfuze-onboarding-portal
server.port=${SERVER_PORT:8080}
server.error.include-message=never
server.error.include-stacktrace=never
server.shutdown=graceful

# --------------------------- PostgreSQL ------------------------------
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/cloudfuze_onboarding}
spring.datasource.username=${DATABASE_USERNAME:cloudfuze}
spring.datasource.password=${DATABASE_PASSWORD:cloudfuze}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${DATABASE_POOL_SIZE:10}
spring.datasource.hikari.pool-name=onboarding-pool

# Schema is generated from the JPA model (indexes included). Switch to
# validate and manage DDL with Flyway/Liquibase for production rollouts.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.format_sql=true

# ----------------------------- Uploads -------------------------------
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:12MB}
app.upload.max-file-size-bytes=${MAX_FILE_SIZE_BYTES:10485760}
app.upload.allowed-extensions=pdf,png,jpg,jpeg,webp
app.upload.allowed-content-types=application/pdf,image/png,image/jpeg,image/jpg,image/webp

# ------------------------- HR authentication -------------------------
# Required. At least 32 characters. The app refuses to start without it.
security.jwt.secret=${JWT_SECRET:}
security.jwt.issuer=${JWT_ISSUER:cloudfuze-onboarding}
security.jwt.expiration=${JWT_EXPIRATION:8h}

# Encrypts the recoverable copy of each candidate portal token, so HR can re-read
# an active link. Leave blank to derive it from the JWT secret.
security.portal-token.encryption-secret=${PORTAL_TOKEN_ENCRYPTION_SECRET:}

# --------------------------- Portal links ----------------------------
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
app.portal-path=${PORTAL_PATH:/upload/{token}}
app.portal-token-ttl=${PORTAL_TOKEN_TTL:14d}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173}

# ------------------------------ Email --------------------------------
# log  -> renders the invitation into the application log (development)
# smtp -> delivers through spring.mail.* below
app.email.provider=${EMAIL_PROVIDER:log}
app.email.from-address=${EMAIL_FROM_ADDRESS:onboarding@cloudfuze.com}
app.email.from-name=${EMAIL_FROM_NAME:CloudFuze Onboarding}
app.email.reply-to=${EMAIL_REPLY_TO:hr@cloudfuze.com}
app.email.support-contact=${EMAIL_SUPPORT_CONTACT:hr@cloudfuze.com}

spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000

# ----------------------------- Storage -------------------------------
# local today; the FileStorageService interface is the swap point for
# S3 / Azure Blob / CloudFuze secure storage.
storage.provider=${STORAGE_PROVIDER:local}
storage.local.root=${STORAGE_LOCAL_ROOT:./storage}

# ------------------------- Development seed --------------------------
app.seed.enabled=${SEED_ENABLED:true}
app.seed.hr-email=${SEED_HR_EMAIL:admin@cloudfuze.com}
# Leave blank to have a strong password generated and printed once at startup.
app.seed.hr-password=${SEED_HR_PASSWORD:}
app.seed.hr-name=${SEED_HR_NAME:CloudFuze HR Admin}
app.seed.hr-job-title=${SEED_HR_JOB_TITLE:HR Operations}
app.seed.sample-candidates=${SEED_SAMPLE_CANDIDATES:false}

# ----------------------------- Logging -------------------------------
logging.level.root=INFO
logging.level.com.cloudfuze.onboarding=${LOG_LEVEL:INFO}
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level %logger{28} - %msg%n

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
