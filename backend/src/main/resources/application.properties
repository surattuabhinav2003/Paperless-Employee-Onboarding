# =====================================================================
# Neutara HR Onboarding Portal - base configuration
# Every secret is read from the environment. Nothing sensitive is
# committed here. See application-example.properties and .env.example.
# =====================================================================
spring.application.name=cloudfuze-onboarding-portal
server.port=${SERVER_PORT:8080}
server.error.include-message=never
server.error.include-stacktrace=never
server.shutdown=graceful

# --------------------------- PostgreSQL ------------------------------
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/cloudfuze_onboarding}
spring.datasource.username=${DATABASE_USERNAME:cloudfuze}
spring.datasource.password=${DATABASE_PASSWORD:cloudfuze}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${DATABASE_POOL_SIZE:10}
spring.datasource.hikari.pool-name=onboarding-pool

# Schema is generated from the JPA model (indexes included). Switch to
# validate and manage DDL with Flyway/Liquibase for production rollouts.
# validate, not update: Hibernate must never alter a live schema on boot.
# The dev profile overrides this; production needs a migration tool.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}

# Flyway owns the schema; Hibernate only checks that it matches the entities.
# baseline-on-migrate adopts a database that already has tables - a developer's,
# or an environment created before Flyway existed - by recording V1 as applied
# rather than trying to run it over the top.
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.format_sql=true

# ----------------------------- Uploads -------------------------------
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:12MB}
# NDA + NOC go to company Microsoft accounts only. Comma-separated; blank
# removes the restriction entirely.
app.noc-recipient-domains=${NOC_RECIPIENT_DOMAINS:cloudfuze.com}

app.upload.max-file-size-bytes=${MAX_FILE_SIZE_BYTES:10485760}
# Word uploads are converted to PDF on arrival (DocumentConversionService),
# so everything downstream still only deals with PDF.
app.upload.allowed-extensions=pdf,doc,docx,png,jpg,jpeg,webp
app.upload.allowed-content-types=application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/msword,image/png,image/jpeg,image/jpg,image/webp

# ------------------------- HR authentication -------------------------
# Required. At least 32 characters. The app refuses to start without it.
security.jwt.secret=${JWT_SECRET:}
security.jwt.issuer=${JWT_ISSUER:cloudfuze-onboarding}
security.jwt.expiration=${JWT_EXPIRATION:8h}

# Encrypts the recoverable copy of each candidate portal token, so HR can re-read
# an active link. Leave blank to derive it from the JWT secret.
security.portal-token.encryption-secret=${PORTAL_TOKEN_ENCRYPTION_SECRET:}

# ---------------- Microsoft Entra ID (Azure AD) sign-in --------------
# "Sign in with Microsoft" for HR. Active only when a tenant id is set.
security.azure.tenant-id=${AZURE_TENANT_ID:}
security.azure.client-id=${AZURE_CLIENT_ID:}
# Only for sending mail as a mailbox through Graph; sign-in does not use it.
security.azure.client-secret=${AZURE_CLIENT_SECRET:}
# Only these addresses may sign in via Microsoft (comma-separated). An empty
# list means any account in the tenant is accepted.
security.azure.allowed-hr-emails=${AZURE_HR_EMAILS:}
# Create an HR record automatically the first time an allowed address signs in.
security.azure.auto-provision=${AZURE_AUTO_PROVISION:true}
security.azure.default-job-title=${AZURE_DEFAULT_JOB_TITLE:HR}

# --------------------------- Portal links ----------------------------
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
app.portal-path=${PORTAL_PATH:/upload/{token}}
app.portal-token-ttl=${PORTAL_TOKEN_TTL:14d}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173}

# ------------------------------ Email --------------------------------
# log  -> renders the invitation into the application log (development)
# smtp -> delivers through spring.mail.* below
# log | smtp | graph. 'graph' sends as a mailbox in the Microsoft 365 tenant,
# which is the only transport that puts a copy in that mailbox's Sent Items -
# SMTP hands the message to a relay that never touches the mailbox at all.
app.email.provider=${EMAIL_PROVIDER:log}
app.email.from-address=${EMAIL_FROM_ADDRESS:onboarding@neutara.com}
app.email.from-name=${EMAIL_FROM_NAME:Neutara Onboarding}
app.email.reply-to=${EMAIL_REPLY_TO:Aditya.Rompella@neutara.com}
app.email.support-contact=${EMAIL_SUPPORT_CONTACT:Aditya.Rompella@neutara.com}
# HR is emailed when a candidate submits, or an offer / NDA + NOC is signed.
# Blank turns these off.
app.email.hr-notify-address=${EMAIL_HR_NOTIFY:Aditya.Rompella@neutara.com}
app.email.hr-notify-name=${EMAIL_HR_NOTIFY_NAME:Neutara HR}
# Blind-copied on every outgoing message, so one person holds the whole
# correspondence rather than reconstructing it from the console. Blank to disable.
app.email.archive-address=${EMAIL_ARCHIVE:}
# The mailbox Graph sends as. Its Sent Items is where the copies land, so this
# is whoever should own the correspondence. Defaults to the from-address.
app.email.graph-sender=${EMAIL_GRAPH_SENDER:}

spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000

# ----------------------------- Storage -------------------------------
# local today; the FileStorageService interface is the swap point for
# S3 / Azure Blob / CloudFuze secure storage.
# Defaults to the database because that is the safe answer on any container
# platform: ./storage is discarded on redeploy, taking every uploaded document
# with it while the rows that reference them survive. Set STORAGE_PROVIDER=local
# only where the disk genuinely persists.
storage.provider=${STORAGE_PROVIDER:database}
storage.local.root=${STORAGE_LOCAL_ROOT:./storage}

# ----------------------- Candidate verification ----------------------
# Emails a short code the first time a candidate opens their link on a new
# device, then remembers that device for 30 days. Proves the person holding
# the link also controls the mailbox it was sent to.
security.portal-verification.enabled=${PORTAL_VERIFICATION_ENABLED:true}

# --------------------------- Rate limiting ---------------------------
# Guards the endpoints an attacker would hammer: sign-in (the only password),
# the candidate portal (the URL token is the credential) and invitation
# resends (each one spends real SMTP quota).
security.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
security.rate-limit.login-per-ip=${RATE_LIMIT_LOGIN_IP:10}
security.rate-limit.login-per-account=${RATE_LIMIT_LOGIN_ACCOUNT:5}
security.rate-limit.login-window=${RATE_LIMIT_LOGIN_WINDOW:15m}
security.rate-limit.portal-per-ip=${RATE_LIMIT_PORTAL_IP:120}
security.rate-limit.portal-window=${RATE_LIMIT_PORTAL_WINDOW:1m}
security.rate-limit.send-per-ip=${RATE_LIMIT_SEND_IP:20}
security.rate-limit.send-window=${RATE_LIMIT_SEND_WINDOW:1h}

# ------------------------- Development seed --------------------------
app.seed.enabled=${SEED_ENABLED:true}
app.seed.hr-email=${SEED_HR_EMAIL:admin@cloudfuze.com}
# Administrators: can manage the document catalogue, candidate detail fields
# and who else is an admin.
app.seed.admin-emails=${SEED_ADMIN_EMAILS:erik@filefuze.co,Abhinav.surattu@cloudfuze.com}
# Leave blank to have a strong password generated and printed once at startup.
app.seed.hr-password=${SEED_HR_PASSWORD:}
app.seed.hr-name=${SEED_HR_NAME:CloudFuze HR Admin}
app.seed.hr-job-title=${SEED_HR_JOB_TITLE:HR Operations}
app.seed.sample-candidates=${SEED_SAMPLE_CANDIDATES:false}

# ----------------------------- Logging -------------------------------
logging.level.root=INFO
logging.level.com.cloudfuze.onboarding=${LOG_LEVEL:INFO}
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level %logger{28} - %msg%n

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# The platform restarts whatever this endpoint calls unhealthy, so it must only
# report on things a restart could fix. A database it cannot reach qualifies.
# The mail server does not: sending already fails softly - the error is logged,
# and releasing an offer letter rolls back so HR can retry - and letting an SMTP
# blip take down a working console would turn a delayed email into an outage.
management.health.mail.enabled=false
