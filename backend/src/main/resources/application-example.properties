# =====================================================================
# Copy to application-local.properties (or export the environment
# variables in .env.example) and fill in real values.
# Never commit completed copies of this file.
# =====================================================================

# PostgreSQL
DATABASE_URL=jdbc:postgresql://localhost:5432/cloudfuze_onboarding
DATABASE_USERNAME=cloudfuze
DATABASE_PASSWORD=change-me

# HR authentication - at least 32 characters of random data
JWT_SECRET=replace-with-openssl-rand-base64-48
JWT_EXPIRATION=8h

# Where the React app is served from; used to build candidate portal links
FRONTEND_URL=https://portal.cloudfuze.com
PORTAL_PATH=/upload/{token}
PORTAL_TOKEN_TTL=14d
CORS_ALLOWED_ORIGINS=https://portal.cloudfuze.com

# Email (set EMAIL_PROVIDER=smtp for real delivery)
EMAIL_PROVIDER=smtp
EMAIL_FROM_ADDRESS=onboarding@cloudfuze.com
EMAIL_FROM_NAME=CloudFuze Onboarding
EMAIL_SUPPORT_CONTACT=hr@cloudfuze.com
MAIL_HOST=smtp.your-provider.com
MAIL_PORT=587
MAIL_USERNAME=smtp-user
MAIL_PASSWORD=smtp-password

# Document storage
STORAGE_PROVIDER=local
STORAGE_LOCAL_ROOT=/var/lib/cloudfuze/onboarding-storage

# Seeding - disable outside development
SEED_ENABLED=false
SEED_HR_EMAIL=admin@cloudfuze.com
SEED_HR_PASSWORD=
SEED_SAMPLE_CANDIDATES=false
