# =====================================================================
# Development profile: run with SPRING_PROFILES_ACTIVE=dev
# The values here are throwaway and must never be used anywhere real.
# =====================================================================
security.jwt.secret=${JWT_SECRET:dev-only-jwt-secret-change-me-1234567890}
security.jwt.expiration=12h

# Matches production: Flyway builds the schema, Hibernate only validates it.
# Left on 'update' this file quietly diverged from the migrations - which is how
# a first deploy came to fail on a schema nobody had noticed was missing.
spring.jpa.hibernate.ddl-auto=validate

app.seed.enabled=true
app.seed.hr-email=admin@cloudfuze.com
app.seed.hr-password=${SEED_HR_PASSWORD:Cloudfuze@123}
app.seed.sample-candidates=${SEED_SAMPLE_CANDIDATES:true}

# Defaults to the log transport for dev, but EMAIL_PROVIDER=smtp in the
# environment (or .env) switches on real delivery through spring.mail.*.
app.email.provider=${EMAIL_PROVIDER:log}
# On disk in development, so an uploaded file can just be opened. Production
# defaults to the database instead - see application.properties.
storage.provider=local
storage.local.root=./storage

logging.level.com.cloudfuze.onboarding=DEBUG
