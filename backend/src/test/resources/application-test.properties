# Tests run against in-memory H2 in PostgreSQL compatibility mode so the
# business-rule suite needs no external services.
spring.datasource.url=jdbc:h2:mem:onboarding;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false

security.jwt.secret=test-jwt-secret-value-for-unit-tests-0123456789
security.jwt.expiration=1h

app.frontend-url=http://localhost:5173
app.portal-path=/upload/{token}
app.portal-token-ttl=14d
app.email.provider=log
app.seed.enabled=false
app.seed.sample-candidates=false

security.rate-limit.enabled=false
security.portal-verification.enabled=false

storage.provider=local
storage.local.root=./build/test-storage


logging.level.com.cloudfuze.onboarding=INFO
logging.level.org.hibernate.SQL=OFF
