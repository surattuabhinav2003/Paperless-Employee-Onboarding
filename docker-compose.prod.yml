# Deployment compose for the HR Onboarding Portal.
#
# Separate from docker-compose.yml on purpose. That file starts PostgreSQL for a
# developer running the backend and Vite from their own terminal; this one builds
# and runs the whole application, and the two must not be confused - `docker
# compose up` on the wrong file on a server gives you a database and nothing else.
#
#   docker compose -f docker-compose.prod.yml --env-file .env up -d --build
#
# What is published, and what is not: only the web container is reachable from
# outside. PostgreSQL has no ports at all - the backend reaches it over the
# internal network by service name - and the backend's port is bound to the
# loopback interface so it can be curl'd on the server for debugging without
# being an unauthenticated path around nginx.
services:
  db:
    image: postgres:16-alpine
    container_name: onboarding-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cloudfuze_onboarding}
      POSTGRES_USER: ${POSTGRES_USER:-cloudfuze}
      # No default. A portal holding Aadhaar and PAN scans does not get to start
      # with a guessable database password because someone forgot a line in .env.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      TZ: ${TZ:-Asia/Kolkata}
    volumes:
      - onboarding-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-cloudfuze} -d ${POSTGRES_DB:-cloudfuze_onboarding}']
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: onboarding-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Compose only substitutes variables this file NAMES. A setting that sits
      # correctly in .env but is absent here never reaches the container - it
      # silently takes the application's own default instead, which is how an
      # email feature ships switched off and nothing appears in the log.
      DATABASE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-cloudfuze_onboarding}
      DATABASE_USERNAME: ${POSTGRES_USER:-cloudfuze}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-10}

      # Flyway owns the schema here and Hibernate only checks it matches. Leave
      # both alone: ddl-auto=update on a server quietly rewrites tables.
      FLYWAY_ENABLED: ${FLYWAY_ENABLED:-true}
      JPA_DDL_AUTO: ${JPA_DDL_AUTO:-validate}

      # Uploaded documents live in PostgreSQL, not on a disk, so there is no
      # volume to lose and a redeploy cannot take the identity scans with it.
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-database}
      MAX_FILE_SIZE: ${MAX_FILE_SIZE:-10MB}
      MAX_REQUEST_SIZE: ${MAX_REQUEST_SIZE:-12MB}

      # Required, and long. Signs every HR session and, by default, derives the
      # key that encrypts the recoverable copy of candidate portal links.
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env - 32+ chars}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-8h}
      PORTAL_TOKEN_ENCRYPTION_SECRET: ${PORTAL_TOKEN_ENCRYPTION_SECRET:-}

      # The address candidates' links are built from. Wrong here and every
      # invitation goes out pointing at a machine the candidate cannot reach.
      FRONTEND_URL: ${FRONTEND_URL:?set FRONTEND_URL to the address candidates will open}
      PORTAL_TOKEN_TTL: ${PORTAL_TOKEN_TTL:-14d}
      # Only needed if the UI is ever served from a different origin than the API.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}

      # Microsoft sign-in for HR.
      AZURE_TENANT_ID: ${AZURE_TENANT_ID:-}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID:-}
      AZURE_CLIENT_SECRET: ${AZURE_CLIENT_SECRET:-}
      # Left empty, ANY account in the tenant that signs in is given an HR login
      # and can read every candidate's documents. On a server the whole company
      # can reach, this is the line that decides who sees Aadhaar numbers.
      AZURE_HR_EMAILS: ${AZURE_HR_EMAILS:?list the HR addresses allowed to sign in}
      AZURE_AUTO_PROVISION: ${AZURE_AUTO_PROVISION:-true}

      # Email.
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-log}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-onboarding@cloudfuze.com}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-Neutara Onboarding}
      EMAIL_REPLY_TO: ${EMAIL_REPLY_TO:-}
      EMAIL_SUPPORT_CONTACT: ${EMAIL_SUPPORT_CONTACT:-}
      EMAIL_HR_NOTIFY: ${EMAIL_HR_NOTIFY:-}
      EMAIL_HR_NOTIFY_NAME: ${EMAIL_HR_NOTIFY_NAME:-Neutara HR}
      EMAIL_ARCHIVE: ${EMAIL_ARCHIVE:-}
      EMAIL_GRAPH_SENDER: ${EMAIL_GRAPH_SENDER:-}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-true}
      MAIL_SMTP_STARTTLS: ${MAIL_SMTP_STARTTLS:-true}

      # The one-time code a candidate needs before their documents open. On.
      PORTAL_VERIFICATION_ENABLED: ${PORTAL_VERIFICATION_ENABLED:-true}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      NOC_RECIPIENT_DOMAINS: ${NOC_RECIPIENT_DOMAINS:-cloudfuze.com}

      # First sign-in. With no password set, a strong one is generated and
      # printed once at startup - read it from `docker compose logs backend`.
      SEED_ENABLED: ${SEED_ENABLED:-true}
      SEED_HR_EMAIL: ${SEED_HR_EMAIL:-admin@cloudfuze.com}
      SEED_HR_PASSWORD: ${SEED_HR_PASSWORD:-}
      # Named here because the application's default still contains an address
      # from a previous company, and a default is not a decision.
      SEED_ADMIN_EMAILS: ${SEED_ADMIN_EMAILS:?list the admin addresses}
      SEED_SAMPLE_CANDIDATES: ${SEED_SAMPLE_CANDIDATES:-false}

      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Deadlines and the dates printed on offer letters are rendered in the
      # JVM's zone. UTC would show a candidate in India the wrong day.
      TZ: ${TZ:-Asia/Kolkata}
    ports:
      - '127.0.0.1:${BACKEND_PORT:-8080}:8080'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:8080/actuator/health | grep -q UP']
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  web:
    build:
      context: ./frontend
      args:
        # Baked into the bundle: changing either needs a rebuild, not a restart.
        VITE_AZURE_CLIENT_ID: ${AZURE_CLIENT_ID:-}
        VITE_AZURE_TENANT_ID: ${AZURE_TENANT_ID:-}
    container_name: onboarding-web
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - '${WEB_PORT:-80}:80'

volumes:
  onboarding-db-data:
