<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#174F96" />
    <title>Neutara Onboarding</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <!--
      Sign-in redirects to Microsoft, so the handshake with it is started while
      the page is still rendering rather than at the moment the button is
      pressed. Saves a DNS lookup and a TLS negotiation off the sign-in path.
    -->
    <link rel="preconnect" href="https://login.microsoftonline.com" />
    <link rel="dns-prefetch" href="https://login.microsoftonline.com" />
    <link rel="icon" type="image/png" href="/neutara-mark.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
