# Serves the built SPA and puts the API on the same origin.
#
# Same origin is the whole design here. The alternative - the browser calling the
# backend on another host or port - needs CORS_ALLOWED_ORIGINS to match exactly,
# and gets the API's hostname baked into the bundle at build time. Proxying /api
# from here means one address to publish, no CORS, and an image that works on
# whatever address the server answers on.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 12MB, to match spring.servlet.multipart.max-request-size. nginx defaults to
    # 1MB and rejects anything larger itself, with a 413 the app never sees - so a
    # candidate photographing an Aadhaar card on a modern phone would be told the
    # upload failed with nothing in the application log to explain it.
    client_max_body_size 12m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # The backend rate-limits by IP and writes the IP into the audit trail.
        # Without this every request appears to come from this container.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Generating an offer letter renders a PDF, which takes longer than the
        # 60s default when the server is cold.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location /actuator/health {
        proxy_pass http://backend:8080;
        access_log off;
    }

    # Hashed filenames, so they can be cached hard and forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html must never be cached: it is what names the current asset hashes,
    # and a stale copy points a returning candidate at files a deploy has removed.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # Client-side routing. /upload/<token> and the HR console are React Router
    # paths with no file behind them; without this a refresh returns 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
